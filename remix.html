<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Love Ritual · Remix</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #E1AD01;
    font-family: system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    perspective: 1200px;
  }

  .scene {
    position: relative;
    width: 100vw;
    min-height: 300vh;
    background-color: #E1AD01;
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
  }

  .floating-asset {
    position: absolute;
    pointer-events: none;
    will-change: transform;
  }

  .border-overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
  }

  .border-overlay img {
    width: 100%;
    height: 100%;
    object-fit: fill;
  }

  /* ── Grain overlay ── */
  .grain {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9998;
    opacity: 0.06;
    mix-blend-mode: overlay;
  }

  .grain::after {
    content: '';
    display: block;
    width: 300%;
    height: 300%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    animation: grainShift 0.3s steps(3) infinite;
    transform: translate(-33%, -33%);
  }

  @keyframes grainShift {
    0%   { transform: translate(-33%, -33%); }
    33%  { transform: translate(-35%, -31%); }
    66%  { transform: translate(-31%, -35%); }
    100% { transform: translate(-33%, -33%); }
  }

  /* ── Scanlines ── */
  .scanlines {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9997;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
  }

  /* ── Boombox ── */
  .boombox {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 10000;
    cursor: pointer;
    width: 80px;
    height: 80px;
    background: #222;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 3px solid #fff;
    box-shadow: 3px 3px 0 #000;
    transition: transform 0.15s, box-shadow 0.15s;
    pointer-events: auto;
    user-select: none;
  }

  .boombox:hover {
    transform: scale(1.1);
    box-shadow: 5px 5px 0 #000;
  }

  .boombox:active {
    transform: scale(0.95);
  }

  .boombox .speaker {
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, #444 30%, #111 70%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #555;
  }

  .boombox .speaker::after {
    content: '♫';
    font-size: 24px;
    color: #fff;
    text-shadow: 0 0 4px rgba(255,255,255,0.5);
  }

  .boombox .label {
    font-size: 7px;
    color: #fff;
    margin-top: 4px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .boombox.playing .speaker::after {
    content: '♪';
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .boombox.playing {
    border-color: #E1AD01;
    box-shadow: 3px 3px 0 #E1AD01, 0 0 20px rgba(225, 173, 1, 0.4);
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="grain"></div>

<div class="scene" id="scene">
  <section class="floating-kiwiana-section" id="hero-background"></section>
</div>

<div class="border-overlay"><img src="assets/kowhaiwhai5.png" alt="" /></div>

<div class="boombox" id="boombox">
  <div class="speaker"></div>
  <span class="label">PLAY</span>
</div>

<audio id="audioPlayer" src="assets/loveritualv1.mp3"></audio>

<script>
// ── Asset sources ──
const kiwianaAssets = [
  'assets/4square.png', 'assets/char.png', 'assets/deep throat.png',
  'assets/footy.png', 'assets/kiwi.png', 'assets/kiwif.png',
  'assets/LR beer.png', 'assets/bumble.png', 'assets/colonizer.png',
  'assets/fishnchips.png', 'assets/maori flag.png', 'assets/dollarbag.png',
  'assets/warrior.png', 'assets/beehive.png', 'assets/kete2.png',
  'assets/pav.png', 'assets/powerlines.png', 'assets/sheepdag.png',
  'assets/spottingknives.png', 'assets/treatymusket.png', 'assets/ashtray.png',
  'assets/kereru.png', 'assets/shed.png',
  'assets/gummies.png', 'assets/punga.png', 'assets/thingee.png',
  'assets/chillybin trimmed.png',
  'assets/fence upscale.png',
  'assets/meatpieupscale.png',
  'assets/pink jandle upscale.png',
  'assets/sauce upscale.png',
  'assets/swandri trim.png',
  'assets/weta trim.png',
  'assets/kina 4x scale.png',
];

const logoAssets = [
  'assets/logo1.png', 'assets/logo2.png', 'assets/logo3.png',
  'assets/logo4.png', 'assets/logo5.png', 'assets/LR-beer.png',
  'assets/logo1recut.png',
  'assets/love ritual logo 6.png'
];

const container = document.getElementById('hero-background');
const particles = [];
let physicsStarted = false;
const W = () => window.innerWidth;
const H = () => Math.max(window.innerHeight, document.documentElement.scrollHeight);
const DRAG = 0.995;
const DRIFT_FORCE = 0.008;
const BOUNCE = 0.85;

function spawnAsset(src, sizeRange, isLogo) {
  const img = document.createElement('img');
  img.src = src;
  img.className = 'floating-asset';
  img.alt = '';
  container.appendChild(img);
  const [min, max] = sizeRange;
  const size = Math.floor(Math.random() * (max - min)) + min;
  img.style.width = size + 'px';
  img.style.height = 'auto';
  const p = {
    el: img, w: size, h: size, size: size,
    x: Math.random() * W(), y: Math.random() * (H() - 100),
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5,
    driftAngle: Math.random() * Math.PI * 2,
    driftPhase: Math.random() * 1000,
    isLogo: isLogo,
    rotPhase: Math.random() * Math.PI * 2,
    rotSpeed: 0.5 + Math.random() * 0.5,
  };
  particles.push(p);
  if (img.complete) onImageLoad(img, p);
  else img.addEventListener('load', () => onImageLoad(img, p));
}

let loadedCount = 0;
function onImageLoad(img, p) {
  p.h = img.naturalHeight * (p.size / img.naturalWidth);
  loadedCount++;
  if (loadedCount === particles.length) startPhysics();
}

window.addEventListener('DOMContentLoaded', () => {
  kiwianaAssets.forEach(src => {
    const size = src.includes('deep throat') ? [360, 360] : [180, 180];
    spawnAsset(src, size, false);
  });
  logoAssets.forEach(src => spawnAsset(src, [180, 180], true));
  window.addEventListener('resize', () => {
    for (const p of particles) {
      p.x = Math.min(p.x, W() - p.size);
      p.y = Math.min(p.y, H() - p.h);
    }
  });
});

function startPhysics() {
  if (physicsStarted) return;
  physicsStarted = true;
  updatePhysics();
}

function updatePhysics() {
  const ww = W();
  const wh = H();
  for (const p of particles) {
    p.driftAngle += (Math.random() - 0.5) * 0.15;
    const drift = DRIFT_FORCE * (0.5 + 0.5 * Math.sin(Date.now() * 0.001 + p.driftPhase));
    p.vx += Math.cos(p.driftAngle) * drift;
    p.vy += Math.sin(p.driftAngle) * drift;
    p.vx *= DRAG;
    p.vy *= DRAG;
    const speed = Math.hypot(p.vx, p.vy);
    if (speed > 2.5) { p.vx = (p.vx / speed) * 2.5; p.vy = (p.vy / speed) * 2.5; }
    p.x += p.vx;
    p.y += p.vy;
    if (p.x + p.size < 0) p.x = ww;
    else if (p.x > ww) p.x = -p.size;
    if (p.y + p.h < 0) p.y = wh;
    else if (p.y > wh) p.y = -p.h;
  }
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const ax = a.x + a.size / 2, ay = a.y + a.h / 2;
      const bx = b.x + b.size / 2, by = b.y + b.h / 2;
      const dx = bx - ax, dy = by - ay;
      const dist = Math.hypot(dx, dy);
      const minDist = (a.size + b.size) / 2 * 0.9;
      if (dist < minDist && dist > 0.001) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = (minDist - dist) / 2;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
        const relVel = dvx * nx + dvy * ny;
        if (relVel > 0) {
          const impulse = relVel * BOUNCE;
          a.vx -= nx * impulse; a.vy -= ny * impulse;
          b.vx += nx * impulse; b.vy += ny * impulse;
        }
      }
    }
  }
  for (const p of particles) {
    const scale = 1 + Math.sin(Date.now() * 0.0009 * p.rotSpeed * 0.5 + p.rotPhase * 1.5) * 0.21;
    p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0)${p.isLogo ? '' : ` rotate(${Math.sin(Date.now() * 0.0002 * p.rotSpeed + p.rotPhase) * 64}deg)`} scale(${scale})`;
  }
  requestAnimationFrame(updatePhysics);
}

// ── 3D Tilt ──
const scene = document.getElementById('scene');
const MAX_TILT = 6;

document.addEventListener('mousemove', (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 2;
  const y = (e.clientY / window.innerHeight - 0.5) * 2;
  scene.style.transform = `rotateY(${x * MAX_TILT}deg) rotateX(${-y * MAX_TILT}deg)`;
});

// ── Boombox audio ──
const boom = document.getElementById('boombox');
const audio = document.getElementById('audioPlayer');
let isPlaying = false;

boom.addEventListener('click', () => {
  if (isPlaying) {
    audio.pause();
    audio.currentTime = 0;
    boom.classList.remove('playing');
    boom.querySelector('.label').textContent = 'PLAY';
  } else {
    audio.play();
    boom.classList.add('playing');
    boom.querySelector('.label').textContent = '♫';
  }
  isPlaying = !isPlaying;
});

audio.addEventListener('ended', () => {
  isPlaying = false;
  boom.classList.remove('playing');
  boom.querySelector('.label').textContent = 'PLAY';
});
</script>
</body>
</html>
