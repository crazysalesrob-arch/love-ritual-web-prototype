<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Infinite Aotearoa ∞ Love Ritual</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #E1AD01; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; cursor: pointer; }
  #border { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #border img { width: 100%; height: 100%; object-fit: fill; }
  #hud { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 20; pointer-events: none; text-align: center; line-height: 1.6; color: rgba(255,255,255,0.6); text-shadow: 0 1px 8px rgba(0,0,0,0.2); }
  #hud .title { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
  #hud .depth { font-size: 11px; opacity: 0.5; letter-spacing: 0.08em; }
  #hud .hint { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.85} }
  #noise { position: fixed; inset: 0; pointer-events: none; z-index: 11; opacity: 0.045; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-repeat: repeat; background-size: 256px 256px; mix-blend-mode: multiply; }
  #scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 12; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px); }
  #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #E1AD01; color: rgba(255,255,255,0.6); font-size: 16px; letter-spacing: 0.08em; transition: opacity 0.8s; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .spinner { width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.15); border-top-color: rgba(255,255,255,0.6); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Flip Card ── */
  #logo-card {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    perspective: 2000px;
    pointer-events: none;
  }
  #logo-card .flipper {
    position: relative;
    width: 100%; height: 100%;
    transition: transform 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);
    transform-style: preserve-3d;
    pointer-events: auto;
    cursor: pointer;
  }
  #logo-card .flipper.flipped {
    transform: rotateY(-180deg);
  }
  #logo-card .front,
  #logo-card .back {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    overflow: hidden;
  }
  #logo-card .back {
    transform: rotateY(180deg);
  }
  #logo-card .front img,
  #logo-card .back img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #flip-hint {
    position: fixed; top: 12px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    pointer-events: none;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-shadow: 0 1px 10px rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.6s;
    text-align: center;
  }
  #flip-hint.show { opacity: 1; }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>loading ∞ aotearoa…</div></div>
<canvas id="c"></canvas>

<div id="logo-card">
  <div class="flipper" id="flipper">
    <div class="front"><img id="front-img" src="assets/logo1recut.png" alt="" /></div>
    <div class="back"><img id="back-img" src="assets/logo1back.png" alt="" /></div>
  </div>
</div>

<div id="flip-hint" class="show">click the logo to flip it ∞</div>

<div id="border"><img src="assets/kowhaiwhai5.png" alt="" /></div>
<div id="noise"></div><div id="scanlines"></div>
<div id="hud">
  <div class="hint" id="hint-text">tap · scroll · click to zoom ∞</div>
  <div class="title">∞ Infinite Aotearoa ∞</div>
  <div class="depth" id="depth-display">depth 0.0</div>
</div>

<script>
// ─── ASSETS ───
const KIWIANA = [
  '4square.png','LR beer.png','ashtray.png','beehive.png',
  'bumble.png','chair.png','colonizer.png',
  'fishnchips.png','footy.png','gummies.png','kereru.png',
  'kete.png','kete2.png','kiwi.png','kiwif.png',
  'maori flag.png','pav.png','pork royal.png','powerlines.png',
  'puhutukawa.png','punga.png','dollarbag-v2.png','shed.png',
  'sheepdag.png','spottingknives.png','thingee.png','treatymusket.png',
  'warrior.png','zig zags.png','dollarbag-v2.png','zip zag 2.png','fence upscale.png','kina 4x scale.png',
  'meatpieupscale.png','pink jandle upscale.png','sauce upscale.png',
  'biggest mouth drink.png', 'swandri trim.png','weta trim.png','chillybin trimmed.png','zip zag 2.png','vape.png','nzflag.png'
];
const ASSET_DIR = 'assets/';
const LOGO_SRC = 'assets/love%20ritual%20logo%206.png';
const CENTER_SRC = 'assets/logo1recut.png';
const CACHE_BUST = '?v=9';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

// ─── FLIP CARD ───
const flipper = document.getElementById('flipper');
const frontImg = document.getElementById('front-img');
const backImg = document.getElementById('back-img');
const logoCard = document.getElementById('logo-card');
const flipHint = document.getElementById('flip-hint');

let isFlipped = false;
let flipAnimating = false;

function positionLogoCard() {
  const size = Math.min(W, H) * 0.55;
  logoCard.style.width = size + 'px';
  logoCard.style.height = size + 'px';
}

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; positionLogoCard(); }
window.addEventListener('resize', resize);
resize();

frontImg.addEventListener('click', (e) => {
  e.stopPropagation();
  if (flipAnimating) return;
  flipAnimating = true;
  flipHint.classList.remove('show');
  isFlipped = true;
  flipper.classList.add('flipped');
  setTimeout(() => { flipAnimating = false; }, 1200);
});

backImg.addEventListener('click', (e) => {
  e.stopPropagation();
  if (flipAnimating) return;
  flipAnimating = true;
  isFlipped = false;
  flipper.classList.remove('flipped');
  setTimeout(() => { flipAnimating = false; }, 1200);
});

// ─── IMAGE CACHE ───
const imageCache = {};
function loadImage(src) { return new Promise(r => { if(imageCache[src]){r(imageCache[src]);return;} const img=new Image(); img.onload=()=>{imageCache[src]=img;r(img);}; img.onerror=()=>{r(null);}; img.src=src; }); }
async function preloadAll() {
  const p = KIWIANA.map(n => loadImage(ASSET_DIR + encodeURI(n) + CACHE_BUST));
  p.push(loadImage(LOGO_SRC));
  // Preload the flip card images too
  p.push(loadImage('assets/logo1recut.png'));
  p.push(loadImage('assets/logo1back.png'));
  await Promise.all(p);
  document.getElementById('loading').classList.add('hidden');
  const h = document.getElementById('hint-text');
  const hide = () => { if(h){h.style.opacity='0';h.style.transition='opacity 0.8s';} };
  document.addEventListener('click', hide); document.addEventListener('wheel', hide);
}
preloadAll();

// ─── FRACTAL GENERATOR ───
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function generateLayer(depth) {
  const rand = seededRandom(42 + depth * 7919);
  const chaos = Math.min(depth / 6, 1);
  const items = [];
  
  items.push({
    type: 'logo',
    wx: 0, wy: 0, baseSize: 130,
    innerRing: false,
    chaos: chaos, floatPhase: rand() * Math.PI * 2,
    rotPhase: rand() * Math.PI * 2,
  });
  
  const innerCount = 8 + Math.floor(depth * 0.5);
  for (let i = 0; i < innerCount; i++) {
    const angle = (i / innerCount) * Math.PI * 2 + (rand() - 0.5) * 0.2;
    const radius = 40 + rand() * 90;
    const idx = Math.floor(rand() * KIWIANA.length);
    items.push({
      type: 'kiwiana', src: KIWIANA[idx],
      wx: Math.cos(angle) * radius, wy: Math.sin(angle) * radius,
      baseSize: 25 + rand() * 35, innerRing: true,
      rotation: (rand() - 0.5) * Math.PI * 0.3,
      floatPhase: rand() * Math.PI * 2, floatAmp: 2 + rand() * 5,
      pulseSpeed: 0.3 + rand() * 0.4, pulseAmp: 0.08 + rand() * 0.1,
      rotSpeed: 0.2 + rand() * 0.3, chaos: chaos,
    });
  }
  
  const outerCount = 14 + depth * 3;
  for (let i = 0; i < outerCount; i++) {
    const angle = (i / outerCount) * Math.PI * 2 + (rand() - 0.5) * 0.3;
    const radius = 180 + rand() * 280;
    const idx = Math.floor(rand() * KIWIANA.length);
    items.push({
      type: 'kiwiana', src: KIWIANA[idx],
      wx: Math.cos(angle) * radius * (0.9 + rand() * 0.2),
      wy: Math.sin(angle) * radius * (0.9 + rand() * 0.2),
      baseSize: 55 + rand() * 80, innerRing: false,
      rotation: (rand() - 0.5) * Math.PI * (0.2 + chaos * 0.5),
      floatPhase: rand() * Math.PI * 2, floatAmp: 3 + rand() * 7 * (1 + chaos),
      pulseSpeed: 0.3 + rand() * 0.4, pulseAmp: 0.06 + rand() * 0.09 * (1 + chaos),
      rotSpeed: 0.15 + rand() * 0.3, chaos: chaos,
    });
  }
  
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2 + (rand() - 0.5) * 0.5;
    const radius = 100 + rand() * 40;
    const idx = Math.floor(rand() * KIWIANA.length);
    items.push({
      type: 'kiwiana', src: KIWIANA[idx],
      wx: Math.cos(angle) * radius, wy: Math.sin(angle) * radius,
      baseSize: 30 + rand() * 25, innerRing: false,
      rotation: (rand() - 0.5) * Math.PI * 0.5,
      floatPhase: rand() * Math.PI * 2, floatAmp: 3 + rand() * 6,
      pulseSpeed: 0.3 + rand() * 0.3, pulseAmp: 0.08 + rand() * 0.12,
      rotSpeed: 0.2 + rand() * 0.3, chaos: chaos,
    });
  }
  return items;
}

const layerCache = {};
function getLayer(depth) {
  const d = Math.floor(depth);
  if (!layerCache[d]) layerCache[d] = generateLayer(d);
  return layerCache[d];
}

// ─── ZOOM STATE ───
let targetZoom = 0; let currentZoom = 0;
const MIN_ZOOM = 0; const MAX_ZOOM = 50;
let autoZoomActive = true; let lastInteraction = 0;

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetZoom += e.deltaY * -0.0025;
  targetZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetZoom));
  autoZoomActive = false; lastInteraction = Date.now();
}, { passive: false });
canvas.addEventListener('click', e => {
  // Don't zoom if click was on the logo card
  if (e.target.closest && e.target.closest('#logo-card')) return;
  targetZoom = Math.min(MAX_ZOOM, targetZoom + 0.35);
  autoZoomActive = false; lastInteraction = Date.now();
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  targetZoom = Math.max(MIN_ZOOM, targetZoom - 0.35);
  autoZoomActive = false; lastInteraction = Date.now();
});
let lastTouchDist = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  if(e.touches.length===1) touchStartY = e.touches[0].clientY;
  else if(e.touches.length===2) lastTouchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); targetZoom+=(d-lastTouchDist)*0.006; targetZoom=Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetZoom)); lastTouchDist=d; autoZoomActive=false; }
  else if(e.touches.length===1){const dy=touchStartY-e.touches[0].clientY; targetZoom+=dy*0.003; targetZoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,targetZoom)); touchStartY=e.touches[0].clientY; autoZoomActive=false; }
}, { passive: false });
document.addEventListener('keydown', e => {
  if(e.key==='+'||e.key==='='||e.key==='ArrowUp'){targetZoom=Math.min(MAX_ZOOM,targetZoom+0.3); autoZoomActive=false;}
  if(e.key==='-'||e.key==='_'||e.key==='ArrowDown'){targetZoom=Math.max(MIN_ZOOM,targetZoom-0.3); autoZoomActive=false;}
  if(e.key==='r'||e.key==='R'){targetZoom=0; autoZoomActive=true;}
});

// ─── RENDER ───
function render(time) {
  const now = Date.now();
  if(autoZoomActive){ targetZoom += 0.015; if(targetZoom > MAX_ZOOM) targetZoom = MIN_ZOOM; }
  else if(now - lastInteraction > 8000){ autoZoomActive = true; }
  
  currentZoom += (targetZoom - currentZoom) * 0.08;
  if(Math.abs(currentZoom - targetZoom) < 0.0001) currentZoom = targetZoom;
  
  document.getElementById('depth-display').textContent = `depth ${currentZoom.toFixed(1)}`;
  
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#E1AD01'; ctx.fillRect(0,0,W,H);
  
  const cx=W/2, cy=H/2, t=time*0.001;
  
  const floor = Math.floor(currentZoom);
  for(let d = Math.max(0, floor - 1); d <= floor + 2; d++) {
    const layer = getLayer(d);
    const z = currentZoom - d;
    const layerScale = Math.pow(2, z);
    
    if(layerScale > 4 || layerScale < 0.003) continue;
    
    let layerAlpha = 1;
    if(z < 0) layerAlpha = Math.max(0, (z + 0.5) / 0.5);
    if(z > 2) layerAlpha = Math.max(0, (2.5 - z) / 0.5);
    if(layerAlpha < 0.01) continue;
    
    for(const item of layer) {
      if(item.type === 'logo') {
        const img = imageCache[LOGO_SRC];
        if(!img) continue;
        const logoZ = Math.min(z, z > 0.8 ? Math.max(0, 1 - (z-0.8)/0.4) : 1);
        let logoAlpha = layerAlpha * logoZ;
        if(logoAlpha < 0.01) continue;
        const size = item.baseSize * layerScale;
        const aspect = img.width / img.height;
        const fx = Math.sin(t*0.3+item.floatPhase)*2;
        const fy = Math.cos(t*0.25+item.floatPhase*1.2)*2;
        ctx.save();
        ctx.globalAlpha = logoAlpha * 0.12;
        ctx.translate(cx+fx, cy+fy);
        ctx.rotate(Math.sin(t*0.1+item.rotPhase)*0.03);
        ctx.drawImage(img, -size/2, -(size/aspect)/2, size, size/aspect);
        ctx.restore();
        continue;
      }
      
      const img = imageCache[ASSET_DIR + encodeURI(item.src) + CACHE_BUST];
      if(!img) continue;
      
      const floatScale = Math.min(1, layerScale);
      const fx = Math.sin(t*0.5+item.floatPhase)*item.floatAmp*floatScale*0.3;
      const fy = Math.cos(t*0.45+item.floatPhase*1.2)*item.floatAmp*floatScale*0.3;
      const rot = item.rotation + Math.sin(t*item.rotSpeed+item.floatPhase)*0.25;
      const pulse = 1 + Math.sin(t*item.pulseSpeed+item.floatPhase*0.7)*item.pulseAmp;
      
      const sx = cx + item.wx * layerScale + fx;
      const sy = cy + item.wy * layerScale + fy;
      const sz = item.baseSize * layerScale * pulse;
      // Double size for biggest mouth drink
      const sizeMult = item.src && item.src.includes('biggest mouth') ? 2 : 1;
      
      if(sz < 2) continue;
      
      const aspect = img.width / img.height;
      const w = sz * sizeMult;
      const h = sz / aspect * sizeMult;
      
      const margin = Math.max(w,h) * 1.3;
      if(sx+margin<0||sx-margin>W||sy+margin<0||sy-margin>H) continue;
      
      let itemAlpha = layerAlpha;
      if(item.innerRing && z > 1.2) itemAlpha *= Math.max(0, (1.8-z)/0.6);
      
      ctx.save();
      ctx.globalAlpha = itemAlpha;
      ctx.translate(sx, sy);
      ctx.rotate(rot);
      ctx.drawImage(img, -w/2, -h/2, w, h);
      ctx.restore();
    }
  }
  
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
